<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Source of truth for the PWA icons in public/icons/.
    Regenerate the PNGs with: php artisan pwa:icons

    Drawn on a full-bleed square because maskable icons are cropped to
    whatever shape the launcher uses (circle, squircle, rounded rect). The
    glyph is kept inside the middle 60% so no platform's crop cuts it.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Angle brackets + slash: reads as "code" at 48px where detail is lost. -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="188,206 140,256 188,306"/>
    <polyline points="324,206 372,256 324,306"/>
    <line x1="286" y1="180" x2="226" y2="332"/>
  </g>
</svg>
